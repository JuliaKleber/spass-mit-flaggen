<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Gradienten | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Spaß mit Flaggen</h1>
    </header>

    <main class="flags-container">
      <div
        class="flag german-flag"
        title="Nationalflagge von Deutschland"
      ></div>

      <div class="flag irish-flag" title="Nationalflagge von Irland"></div>

      <div class="flag japanese-flag" title="Nationalflagge von Japan"></div>

      <div class="flag benin-flag" title="Nationalflagge von Benin"></div>

      <div class="flag swedish-flag" title="Nationalflagge von Schweden"></div>
    </main>
  </body>
</html>
