<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verschiedenes | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="../general-styles.css" />
    <link rel="stylesheet" type="text/css" href="./styles-loesung.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>Spaß mit Flaggen</h1>
    </header>

    <main class="flags-container">
      <div
        aria-label="Nationalflagge von Jamaika"
        class="flag jamaika"
        role="img"
        title="Nationalflagge von Jamaika, erstellt mit clip-pat"
      >
        <div class="left"></div>
        <div class="top"></div>
        <div class="right"></div>
        <div class="bottom"></div>
      </div>

      <div
        aria-label="Nationalflagge der Grönland"
        class="flag greenland"
        role="img"
        title="Nationalflagge der Grönland"
      ></div>

      <div class="flag great-britain" title="Nationalflagge von Großbrittanien">
        <div class="andreas-cross">
          <div class="white beam white-diagonal top-left-to-bottom-right"></div>
          <div class="white beam white-diagonal bottom-left-to-top-right"></div>
        </div>

        <div class="red-diagonal">
          <div class="red red-diagonal-beam top-left-to-center"></div>
          <div class="red red-diagonal-beam top-right-to-center"></div>
          <div class="red red-diagonal-beam bottom-right-to-center"></div>
          <div class="red red-diagonal-beam bottom-left-to-center"></div>
        </div>

        <div class="white-cross">
          <div class="white beam horizontal"></div>
          <div class="white beam vertical"></div>
        </div>

        <div class="red-cross">
          <div class="red beam vertical red-foreground"></div>
          <div class="red beam horizontal red-foreground"></div>
        </div>
      </div>

      <!-- <div
        aria-label="Nationalflagge von Jamaika"
        class="flag border jamaika"
        role="img"
        title="Nationalflagge von Jamaika, erstellt mit border"
      ></div> -->
    </main>
  </body>
</html>
