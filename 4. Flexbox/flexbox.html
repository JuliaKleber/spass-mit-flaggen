<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="../general-styles.css" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <div>
      <header class="header">
        <h1>Spaß mit Flaggen</h1>
        <p class="sub-title">Flexbox</p>
      </header>

      <main>
        <div class="flags-container">
          <div
            aria-label="Nationalflagge der Niederlande"
            class="flag netherlands"
            role="img"
            title="Nationalflagge der Niederlande"
          >
            <div class="stripe red"></div>
            <div class="stripe white"></div>
            <div class="stripe blue"></div>
          </div>

          <div
            aria-label="Nationalflagge von Italien"
            class="flag italy"
            role="img"
            title="Nationalflagge von Italien"
          >
            <div class="stripe green"></div>
            <div class="stripe white"></div>
            <div class="stripe red"></div>
          </div>

          <div
            aria-label="Nationalflagge von Mauritius"
            class="flag mauritius"
            role="img"
            title="Nationalflagge von Mauritius"
          >
            <div class="stripe red"></div>
            <div class="stripe blue"></div>
            <div class="stripe yellow"></div>
            <div class="stripe green"></div>
          </div>

          <div
            aria-label="Nationalflagge von Thailand"
            class="flag thailand"
            role="img"
            title="Nationalflagge von Thailand"
          >
            <div class="stripe red"></div>
            <div class="stripe blue"></div>
            <div class="stripe red"></div>
          </div>

          <div
            aria-label="Nationalflagge von Benin"
            class="flag benin"
            role="img"
            title="Nationalflagge von Benin"
          >
            <div class="green"></div>
            <div class="horizontal-stripes-container">
              <div class="stripe yellow"></div>
              <div class="stripe red"></div>
            </div>
          </div>

          <div
            aria-label="Nationalflagge von Japan"
            class="flag japan"
            role="img"
            title="Nationalflagge von Japan"
          >
            <div class="circle"></div>
          </div>

          <div
            aria-label="Nationalflagge der Schweiz"
            class="flag switzerland"
            role="img"
            title="Nationalflagge der Schweiz"
          >
            <div class="spacer"></div>
            <div class="vertical"></div>
            <div class="horizontal"></div>
            <div class="vertical"></div>
            <div class="spacer"></div>
          </div>
        </div>
      </main>
    </div>

    <footer>
      <nav>
        <ul class="links">
          <li>
            <a href="./data-protection.html" class="text-link-footer"
              >Datenschutzerklärung</a
            >
          </li>
          <div class="icon-links">
            <li>
              <a href="https://github.com/JuliaKleber" class="icon-link">
                <i class="fa-brands fa-github"></i>
              </a>
            </li>
            <li>
              <a
                href="https://www.linkedin.com/in/juliakleber/"
                class="icon-link"
              >
                <i class="fa-brands fa-linkedin"></i>
              </a>
            </li>
          </div>
        </ul>
      </nav>
    </footer>
  </body>
</html>
