<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="../general-styles.css" />
    <link rel="stylesheet" type="text/css" href="styles-loesung.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>Spaß mit Flaggen</h1>
    </header>

    <main class="flags-container">
      <div
        aria-label="Nationalflagge der Niederlande"
        class="flag netherlands"
        title="Nationalflagge der Niederlande"
        role="img"
      >
        <div class="stripe red"></div>
        <div class="stripe blue"></div>
      </div>

      <div
        aria-label="Nationalflagge von Italien"
        class="flag italy"
        role="img"
        title="Nationalflagge von Italien"
      >
        <div class="stripe green"></div>
        <div class="stripe red"></div>
      </div>

      <div
        aria-label="Nationalflagge von Mauritius"
        class="flag mauritius"
        role="img"
        title="Nationalflagge von Mauritius"
      >
        <div class="stripe red"></div>
        <div class="stripe blue"></div>
        <div class="stripe yellow"></div>
        <div class="stripe green"></div>
      </div>

      <div
        aria-label="Nationalflagge von Japan"
        class="flag japan"
        role="img"
        title="Nationalflagge von Japan"
      >
        <div class="red-circle"></div>
      </div>

      <div
        aria-label="Nationalflagge von Benin"
        class="flag benin"
        role="img"
        title="Nationalflagge von Benin"
      >
        <div class="green"></div>
        <div class="yellow"></div>
        <div class="red"></div>
      </div>

      <div
        aria-label="Nationalflagge der Schweiz"
        class="flag switzerland"
        role="img"
        title="Nationalflagge der Schweiz"
      >
        <div class="vertical"></div>
        <div class="horizontal"></div>
      </div>

      <div
        aria-label="Nationalflagge von Schweden"
        class="flag sweden"
        role="img"
        title="Nationalflagge von Schweden"
      >
        <div class="horizontal-beam"></div>
        <div class="vertical-beam"></div>
      </div>
    </main>
  </body>
</html>
