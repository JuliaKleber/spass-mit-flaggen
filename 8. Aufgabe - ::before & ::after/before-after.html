<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>::before & ::after | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="../general-styles.css" />
    <link rel="stylesheet" type="text/css" href="styles-loesung.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>Spaß mit Flaggen</h1>
    </header>

    <main class="flags-container">
      <div
        aria-label="Nationalflagge der Niederlande"
        class="flag netherlands"
        role="img"
        title="Nationalflagge der Niederlande"
      ></div>

      <div
        aria-label="Nationalflagge von Italien"
        class="flag italy"
        role="img"
        title="Nationalflagge von Italien"
      ></div>

      <div
        aria-label="Nationalflagge von Benin"
        class="flag benin"
        role="img"
        title="Nationalflagge von Benin"
      ></div>

      <div
        aria-label="Nationalflagge von Japan"
        class="flag japan"
        role="img"
        title="Nationalflagge von Japan"
      ></div>

      <div
        aria-label="Nationalflagge von Schweiz"
        class="flag switzerland"
        role="img"
        title="Nationalflagge von Schweiz"
      ></div>

      <div
        aria-label="Nationalflagge von Schweden"
        class="flag sweden"
        role="img"
        title="Nationalflagge von Schweden"
      ></div>
    </main>
  </body>
</html>
