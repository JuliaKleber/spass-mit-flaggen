<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaß mit Flaggen - Aufgabe 4</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Spaß mit Flaggen</h1>
    </header>

    <main class="flags-container">
      <div class="flag czech-republic-flag">
        <div class="blue"></div>
        <div class="stripe white"></div>
        <div class="stripe red"></div>
      </div>

      <div class="flag bahamas-flag">
        <div class="black"></div>
        <div class="stripe blue"></div>
        <div class="stripe yellow"></div>
        <div class="stripe blue"></div>
      </div>

      <div class="flag scottish-flag">
        <div class="beam top-left-to-bottom-right"></div>
        <div class="beam bottom-left-to-top-right"></div>
      </div>

      <div class="flag british-flag">
        <div class="white white-diagonal-beam top-left-to-bottom-right"></div>
        <div class="white white-diagonal-beam bottom-left-to-top-right"></div>
        <div class="red red-diagonal-beam top-left-to-bottom-right"></div>
        <div class="red red-diagonal-beam bottom-left-to-top-right"></div>

        <div class="white vertical white-foreground"></div>
        <div class="white horizontal white-foreground"></div>
        <div class="red vertical red-foreground"></div>
        <div class="red horizontal red-foreground"></div>
      </div>
    </main>
  </body>
</html>
