<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <title>Normal Flow | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="../general-styles.css" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500&display=swap"
      rel="stylesheet"
    />

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <div class="content-wrapper">
      <header class="header">
        <div class="header-content">
          <a href="../index.html" class="home-link">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-house-icon lucide-house"
            >
              <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
              <path
                d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
              />
            </svg>
          </a>
          <p class="title">Spaß mit Flaggen</p>
        </div>
      </header>

      <main>
        <h1>Normal Flow</h1>
        <div class="flags-container">
          <div
            aria-label="Nationalflagge der Niederlande"
            class="flag netherlands"
            title="Nationalflagge der Niederlande"
            role="img"
          >
            <div class="stripe red"></div>
            <div class="stripe white"></div>
            <div class="stripe blue"></div>
          </div>

          <div
            aria-label="Nationalflagge von Italien"
            class="flag italy"
            role="img"
            title="Nationalflagge von Italien"
          >
            <div class="stripe green"></div>
            <div class="stripe white"></div>
            <div class="stripe red"></div>
          </div>

          <div
            aria-label="Nationalflagge von Mauritius"
            class="flag mauritius"
            role="img"
            title="Nationalflagge von Mauritius"
          >
            <div class="stripe red"></div>
            <div class="stripe blue"></div>
            <div class="stripe yellow"></div>
            <div class="stripe green"></div>
          </div>

          <div
            aria-label="Nationalflagge von Thailand"
            class="flag thailand"
            role="img"
            title="Nationalflagge von Thailand"
          >
            <div class="stripe red"></div>
            <div class="stripe white"></div>
            <div class="stripe blue"></div>
            <div class="stripe white"></div>
            <div class="stripe red"></div>
          </div>

          <div
            aria-label="Nationalflagge von Benin"
            class="flag benin"
            role="img"
            title="Nationalflagge von Benin"
          >
            <div class="green"></div>
            <div class="horizontal-stripes-container">
              <div class="stripe yellow"></div>
              <div class="stripe red"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <footer class="footer">
      <nav class="footer__nav">
        <div class="footer__group">
          <a
            href="../data-protection.html"
            class="text-link footer__link footer__link--text"
            >Datenschutzerklärung</a
          >

          <a
            href="../imprint.html"
            class="text-link footer__link footer__link--text"
            >Impressum</a
          >
        </div>

        <div class="footer__group">
          <a
            aria-label="GitHub Profil von Julia Kleber"
            class="footer__link footer__link--icon"
            href="https://github.com/JuliaKleber"
            rel="noopener"
            target="_blank"
          >
            <i class="fa-brands fa-github" aria-hidden="true"></i>
          </a>

          <a
            aria-label="LinkedIn Profil von Julia Kleber"
            class="footer__link footer__link--icon"
            href="https://www.linkedin.com/in/juliakleber/"
            rel="noopener"
            target="_blank"
          >
            <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
          </a>
        </div>
      </nav>
    </footer>
