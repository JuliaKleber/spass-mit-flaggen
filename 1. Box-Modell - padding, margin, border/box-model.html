<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box-Modell | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="../general-styles.css" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <div>
      <header class="header">
        <h1>Spaß mit Flaggen</h1>
        <p class="sub-title">Box-Modell</p>
      </header>

      <main>
        <div class="flags-container">
          <div
            aria-label="Nationalflagge von Österreich"
            class="flag austria"
            role="img"
            title="Nationalflagge von Österreich"
          ></div>

          <div
            aria-label="Nationalflagge von Lettland"
            class="flag latvia"
            role="img"
            title="Nationalflagge von Lettland"
          ></div>

          <div
            aria-label="Nationalflagge von Indonesien"
            class="flag indonesia"
            role="img"
            title="Nationalflagge von Indonesien"
          ></div>

          <div
            aria-label="Nationalflagge von Nigeria"
            class="flag nigeria"
            role="img"
            title="Nationalflagge von Nigeria"
          ></div>

          <div
            aria-label="Nationalflagge von Japan"
            class="flag japan"
            role="img"
            title="Nationalflagge von Japan"
          >
            <div class="circle"></div>
          </div>

          <div
            aria-label="Nationalflagge von Palau"
            class="flag palau"
            role="img"
            title="Nationalflagge von Palau"
          >
            <div class="circle"></div>
          </div>

          <div
            aria-label="Nationalflagge von Thailand"
            class="flag thailand"
            role="img"
            title="Nationalflagge von Thailand"
          >
            <div class="blue-stripe"></div>
          </div>
        </div>
      </main>
    </div>

    <footer class="footer">
      <nav class="footer__nav">
        <div class="footer__group">
          <a
            href="../data-protection.html"
            class="text-link footer__link footer__link--text"
            >Datenschutzerklärung</a
          >

          <a
            href="../imprint.html"
            class="text-link footer__link footer__link--text"
            >Impressum</a
          >
        </div>

        <div class="footer__group">
          <a
            aria-label="GitHub Profil von Julia Kleber"
            class="footer__link footer__link--icon"
            href="https://github.com/JuliaKleber"
            rel="noopener"
            target="_blank"
          >
            <i class="fa-brands fa-github" aria-hidden="true"></i>
          </a>

          <a
            aria-label="LinkedIn Profil von Julia Kleber"
            class="footer__link footer__link--icon"
            href="https://www.linkedin.com/in/juliakleber/"
            rel="noopener"
            target="_blank"
          >
            <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
          </a>
        </div>
      </nav>
    </footer>
  </body>
</html>
