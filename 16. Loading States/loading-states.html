<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ladezustände mit Keyframes | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="../general-styles.css" />
    <link rel="stylesheet" type="text/css" href="./flag-styles.css" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="header">
      <h1>Spaß mit Flaggen</h1>
      <p class="sub-title">Ladezustände mit Keyframes</p>
    </header>

    <main class="flags-container" aria-busy="true" aria-live="polite">
      <svg
        class="loading-spinner"
        viewBox="0 0 20 20"
        role="status"
        aria-label="Lädt..."
      >
        <path
          d="M 10,1 A 9,9 0 1 0 19,10"
          fill="transparent"
          stroke="#b0b0b0"
          stroke-width="2"
          stroke-linecap="round"
        ></path>
        <path
          d="M 10,1 A 9,9 0 0 1 19,10"
          fill="transparent"
          stroke="#505050"
          stroke-width="2"
          stroke-linecap="round"
        ></path>
      </svg>

      <div class="skeleton-pulse" role="status" aria-label="Lädt..."></div>

      <div class="skeleton-shimmer" role="status" aria-label="Lädt..."></div>

      <div class="bouncing-dots" role="status" aria-label="Lädt...">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </main>
  </body>
</html>
