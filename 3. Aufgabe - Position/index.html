<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Spaß mit Flaggen</h1>
    </header>

    <main class="flags-container">
      <div class="flag german-flag" title="Nationalflagge von Deutschland">
        <div class="stripe black"></div>
        <div class="stripe red"></div>
        <div class="stripe gold"></div>
      </div>

      <div class="flag irish-flag" title="Nationalflagge von Irland">
        <div class="stripe green"></div>
        <div class="stripe orange"></div>
      </div>

      <div class="flag japanese-flag" title="Nationalflagge von Japan">
        <div class="red-circle"></div>
      </div>

      <div class="flag benin-flag" title="Nationalflagge von Benin">
        <div class="green"></div>
        <div class="yellow"></div>
        <div class="red"></div>
      </div>

      <div class="flag swedish-flag" title="Nationalflagge von Schweden">
        <div class="horizontal-beam"></div>
        <div class="vertical-beam"></div>
      </div>
    </main>
  </body>
</html>
