<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="../general-styles.css" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <div>
      <header class="header">
        <h1>Spaß mit Flaggen</h1>
        <p class="sub-title">Scalable Vector Graphics</p>
      </header>

      <main class="flags-container">
        <svg class="flag" role="img">
          <title>Nationalflagge der Niederlande</title>
        </svg>

        <svg class="flag" role="img">
          <title>Nationalflagge von Italien</title>
        </svg>

        <svg class="flag" role="img">
          <title>Nationalflagge von Mauritius</title>
        </svg>

        <svg class="flag" role="img">
          <title>Nationalflagge von Thailand</title>
        </svg>

        <svg class="flag" role="img">
          <title>Nationalflagge von Benin</title>
        </svg>

        <svg class="flag" role="img">
          <title>Nationalflagge von Schweden</title>
        </svg>

        <svg class="flag" role="img">
          <title>Nationalflagge der Schweiz</title>
        </svg>

        <svg class="flag" role="img">
          <title>Nationalflagge von Japan</title>
        </svg>

        <svg class="flag" role="img">
          <title>Nationalflagge von Palau</title>
        </svg>

        <svg class="flag" role="img">
          <title>Nationalflagge der Tschechischen Republik</title>
        </svg>

        <svg class="flag" role="img">
          <title>Nationalflagge der Bahamas</title>
        </svg>

        <svg class="flag" role="img">
          <title>Nationalflagge von Jamaika</title>
        </svg>

        <svg class="flag" role="img">
          <title>Nationalflagge von Seychellen</title>
        </svg>
      </main>
    </div>

    <footer class="footer">
      <nav class="footer__nav">
        <div class="footer__group">
          <a
            href="../data-protection.html"
            class="footer__link footer__link--text"
            >Datenschutzerklärung</a
          >

          <a href="../imprint.html" class="footer__link footer__link--text"
            >Impressum</a
          >
        </div>

        <div class="footer__group">
          <a
            aria-label="GitHub Profil von Julia Kleber"
            class="footer__link footer__link--icon"
            href="https://github.com/JuliaKleber"
            rel="noopener"
            target="_blank"
          >
            <i class="fa-brands fa-github" aria-hidden="true"></i>
          </a>

          <a
            aria-label="LinkedIn Profil von Julia Kleber"
            class="footer__link footer__link--icon"
            href="https://www.linkedin.com/in/juliakleber/"
            rel="noopener"
            target="_blank"
          >
            <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
          </a>
        </div>
      </nav>
    </footer>
  </body>
</html>
