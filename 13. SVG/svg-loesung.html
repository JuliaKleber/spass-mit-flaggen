<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="../general-styles.css" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <div>
      <header class="header">
        <h1>Spaß mit Flaggen</h1>
        <p class="sub-title">Scalable Vector Graphics</p>
      </header>

      <main class="flags-container">
        <svg class="flag" role="img" viewBox="0 0 4.5 3">
          <title>Nationalflagge der Niederlande</title>
          <rect width="4.5" height="1" y="0" fill="rgb(174, 28, 40)" />
          <rect width="4.5" height="1" y="1" fill="rgb(255, 255, 255)" />
          <rect width="4.5" height="1" y="2" fill="rgb(33, 70, 139)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 3 2">
          <title>Nationalflagge von Italien</title>
          <rect width="1" height="2" x="0" fill="rgb(0, 140, 69)" />
          <rect width="1" height="2" x="1" fill="rgb(244, 245, 240)" />
          <rect width="1" height="2" x="2" fill="rgb(205, 33, 42)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 3 2">
          <title>Nationalflagge von Mauritius</title>
          <rect width="3" height="0.5" y="0" fill="rgb(208, 28, 31)" />
          <rect width="3" height="0.5" y="0.5" fill="rgb(45, 51, 89)" />
          <rect width="3" height="0.5" y="1" fill="rgb(247, 183, 24)" />
          <rect width="3" height="0.5" y="1.5" fill="rgb(0, 134, 88)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 4.5 3">
          <title>Nationalflagge von Thailand</title>
          <rect width="4.5" height="0.5" y="0" fill="rgb(165, 25, 49)" />
          <rect width="4.5" height="0.5" y="0.5" fill="rgb(255, 255, 255)" />
          <rect width="4.5" height="1" y="1" fill="rgb(45, 42, 74)" />
          <rect width="4.5" height="0.5" y="2" fill="rgb(255, 255, 255)" />
          <rect width="4.5" height="0.5" y="2.5" fill="rgb(165, 25, 49)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 3 2">
          <title>Nationalflagge von Benin</title>
          <rect width="1.2" height="2" fill="rgb(0, 136, 86)" />
          <rect width="1.8" height="1" x="1.2" fill="rgb(252, 209, 22)" />
          <rect width="1.8" height="1" x="1.2" y="1" fill="rgb(227, 28, 35)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 16 10">
          <title>Nationalflagge von Schweden</title>
          <rect width="16" height="10" fill="rgb(0, 106, 167)" />
          <rect width="16" height="2" x="0" y="4" fill="rgb(254, 204, 0)" />
          <rect width="2" height="10" x="5" y="0" fill="rgb(254, 204, 0)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 32 32">
          <title>Nationalflagge der Schweiz</title>
          <rect width="32" height="32" fill="rgb(218, 41, 28)" />
          <rect width="20" height="6" x="6" y="13" fill="rgb(255, 255, 255)" />
          <rect width="6" height="20" x="13" y="6" fill="rgb(255, 255, 255)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 3 2">
          <title>Nationalflagge von Japan</title>
          <rect width="3" height="2" fill="rgb(255, 255, 255)" />
          <circle cx="1.5" cy="1" r="0.6" fill="rgb(188, 0, 45)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 8 5">
          <title>Nationalflagge von Palau</title>
          <rect width="8" height="5" fill="rgb(74, 172, 238)" />
          <circle cx="3" cy="2.5" r="1.5" fill="rgb(255, 222, 0)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 3 2">
          <title>Nationalflagge der Tschechischen Republik</title>
          <rect width="3" height="1" fill="rgb(255, 255, 255)" />
          <rect width="3" height="1" y="1" fill="rgb(215, 20, 26)" />
          <polygon points="0,0 1.5,1 0,2" fill="rgb(17, 49, 126)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 6 3">
          <title>Nationalflagge der Bahamas</title>
          <rect width="6" height="1" fill="rgb(0, 169, 206)" />
          <rect width="6" height="1" y="1" fill="rgb(255, 199, 44)" />
          <rect width="6" height="1" y="2" fill="rgb(0, 169, 206)" />
          <polygon points="0,0 2.73,1.5 0,3" fill="rgb(0, 0, 0)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 5 3">
          <title>Nationalflagge von Trinidad und Tobago</title>
          <rect width="5" height="3" fill="rgb(200, 16, 46)" />
          <polygon points="0,0 1.5,0 5,3 3.5,3" fill="rgb(255, 255, 255)" />
          <polygon points="0.25,0 1.25,0 4.75,3 3.75,3" fill="rgb(0, 0, 0)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 3 2">
          <title>Nationalflagge von Schottland</title>
          <rect width="3" height="2" fill="rgb(255, 255, 255)" />
          <polygon points="0.3,0 2.7,0 1.5,0.8" fill="rgb(0, 94, 184)" />
          <polygon points="3,0.2 3,1.8 1.8,1" fill="rgb(0, 94, 184)" />
          <polygon points="1.5,1.2 2.7,2 0.3,2" fill="rgb(0, 94, 184)" />
          <polygon points="0,0.2 1.2,1 0,1.8" fill="rgb(0, 94, 184)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 2 1">
          <title>Nationalflagge von Jamaika</title>
          <rect width="2" height="1" fill="rgb(255, 199, 0)" />
          <polygon points="0.2,0 1.8,0 1,0.4" fill="rgb(25, 151, 93)" />
          <polygon points="2,0.1 1.2,0.5 2,0.9" fill="rgb(0, 0, 0)" />
          <polygon points="0.2,1 1.8,1 1,0.6" fill="rgb(25, 151, 93)" />
          <polygon points="0,0.1 0.8,0.5 0,0.9" fill="rgb(0, 0, 0)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 6 3">
          <title>Nationalflagge von Seychellen</title>
          <polygon points="0,0 2,0 0,3" fill="rgb(0, 63, 135)" />
          <polygon points="2,0 4,0 0,3" fill="rgb(252, 209, 22)" />
          <polygon points="4,0 6,0 6,1 0,3" fill="rgb(212, 28, 48)" />
          <polygon points="6,1 6,2 0,3" fill="rgb(255, 255, 255)" />
          <polygon points="6,2 6,3 0,3" fill="rgb(0, 122, 61)" />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 30 20">
          <title>Nationalflagge der Türkei</title>
          <rect width="30" height="20" fill="rgb(227, 10, 23)"></rect>
          <circle cx="10" cy="10" r="5" fill="rgb(255, 255, 255)" />
          <circle cx="11.25" cy="10" r="4" fill="rgb(227, 10, 23)" />
          <polygon
            points="13.92,10 18.47,11.45 15.67,7.6 15.67,12.4 18.47,8.55 "
            fill="rgb(255, 255, 255)"
          />
        </svg>

        <svg class="flag" role="img" viewBox="0 0 18 12">
          <title>Nationalflagge von Grönland</title>
          <rect width="18" height="6" fill="rgb(255, 255, 255)"></rect>
          <rect width="18" height="6" y="6" fill="rgb(239, 51, 64)"></rect>
          <path d="M 3,6 A 4,4 0 0 0 11,6 Z" fill="rgb(255, 255, 255)" />
          <path d="M 3,6 A 4,4 0 0 1 11,6 Z" fill="rgb(239, 51, 64)" />
        </svg>
      </main>
    </div>

    <footer>
      <nav>
        <ul class="links">
          <div class="text-links">
            <li>
              <a href="../data-protection.html" class="text-link-footer"
                >Datenschutzerklärung</a
              >
            </li>
            <li>
              <a href="../imprint.html" class="text-link-footer">Impressum</a>
            </li>
          </div>
          <div class="icon-links">
            <li>
              <a href="https://github.com/JuliaKleber" class="icon-link">
                <i class="fa-brands fa-github"></i>
              </a>
            </li>
            <li>
              <a
                href="https://www.linkedin.com/in/juliakleber/"
                class="icon-link"
              >
                <i class="fa-brands fa-linkedin"></i>
              </a>
            </li>
          </div>
        </ul>
      </nav>
    </footer>
  </body>
</html>
