<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verschiedenes | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="../general-styles.css" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>Spaß mit Flaggen</h1>
    </header>

    <main class="flags-container">
      <div
        aria-label="Nationalflagge der Niederlande"
        class="flag netherlands"
        title="Nationalflagge der Niederlande"
        role="img"
      ></div>

      <div
        aria-label="Nationalflagge von Italien"
        class="flag italy"
        role="img"
        title="Nationalflagge von Italien"
      ></div>

      <div
        aria-label="Nationalflagge von Mauritius"
        class="flag mauritius"
        role="img"
        title="Nationalflagge von Mauritius"
      ></div>

      <div
        aria-label="Nationalflagge von Thailand"
        class="flag thailand"
        role="img"
        title="Nationalflagge von Thailand"
      ></div>

      <div
        aria-label="Nationalflagge von Benin"
        class="flag benin"
        role="img"
        title="Nationalflagge von Benin"
      ></div>

      <div
        aria-label="Nationalflagge von Japan"
        class="flag japan"
        role="img"
        title="Nationalflagge von Japan"
      ></div>

      <div
        aria-label="Nationalflagge von Palau"
        class="flag palau"
        role="img"
        title="Nationalflagge von Palau"
      ></div>

      <div
        aria-label="Nationalflagge der Tschechischen Republik"
        class="flag czech-republic"
        role="img"
        title="Nationalflagge der Tschechischen Republik"
      ></div>

      <div
        aria-label="Nationalflagge von Bahamas"
        class="flag bahamas"
        role="img"
        title="Nationalflagge von Bahamas"
      ></div>

      <div
        aria-label="Nationalflagge von Schweden"
        class="flag sweden"
        role="img"
        title="Nationalflagge von Schweden"
      ></div>

      <div
        aria-label="Flagge von Grönland"
        class="flag greenland"
        role="img"
        title="Flagge von Grönland"
      ></div>

      <div
        aria-label="Flagge von Seychellen"
        class="flag seychelles"
        role="img"
        title="Flagge von Seychellen"
      >
        <div class="stripe blue"></div>
        <div class="stripe yellow"></div>
        <div class="stripe red"></div>
        <div class="stripe white"></div>
        <div class="stripe green"></div>
      </div>

      <div
        aria-label="Nationalflagge der Schweiz"
        class="flag switzerland"
        role="img"
        title="Nationalflagge der Schweiz"
      ></div>

      <div
        aria-label="Flagge von Schottland"
        class="flag scotland"
        role="img"
        title="Flagge von Schottland"
      ></div>

      <div
        aria-label="Nationalflagge von Jamaika"
        class="flag jamaica"
        role="img"
        title="Nationalflagge von Jamaika"
      ></div>

      <div
        aria-label="Nationalflagge von Trinidad und Tobago"
        class="flag trinidad-and-tobago"
        role="img"
        title="Nationalflagge von Trinidad und Tobago"
      ></div>

      <div
        aria-label="Nationalflagge der Türkei"
        class="flag turkey"
        role="img"
        title="Nationalflagge der Türkei"
      >
        <div class="star"></div>
      </div>
    </main>
  </body>
</html>
