<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaß mit Flaggen - Aufgabe 1</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Spaß mit Flaggen</h1>
      <p>Erstellt mit Flexbox</p>
    </header>

    <main class="main">
      <div class="flag german-flag">
        <div class="black"></div>
        <div class="red"></div>
        <div class="gold"></div>
      </div>

      <div class="flag irish-flag">
        <div class="green"></div>
        <div class="white"></div>
        <div class="orange"></div>
      </div>

      <div class="flag japanese-flag">
        <div class="circle"></div>
      </div>

      <div class="flag benin-flag">
        <div class="green"></div>
        <div class="stripes-container">
          <div class="yellow"></div>
          <div class="red"></div>
        </div>
      </div>
    </main>
  </body>
</html>
