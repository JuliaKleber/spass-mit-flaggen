<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dreiecke | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="../general-styles.css" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <header class="header">
      <h1>Spaß mit Flaggen</h1>
      <p class="sub-title">Dreiecke</p>
    </header>

    <main class="flags-container">
      <div
        aria-label="Nationalflagge der Tschechischen Republik"
        class="flag border czech-republic"
        role="img"
        title="Nationalflagge der Tschechischen Republik"
      ></div>

      <div
        aria-label="Nationalflagge der Bahamas"
        class="flag border bahamas"
        role="img"
        title="Nationalflagge der Bahamas"
      ></div>

      <div
        aria-label="Nationalflagge der Tschechischen Republik"
        class="flag clip-path czech-republic"
        role="img"
        title="Nationalflagge der Tschechischen Republik"
      ></div>

      <div
        aria-label="Nationalflagge der Bahamas"
        class="flag clip-path bahamas"
        role="img"
        title="Nationalflagge der Bahamas"
      ></div>

      <div
        aria-label="Nationalflagge der Tschechischen Republik"
        class="flag gradient czech-republic"
        role="img"
        title="Nationalflagge der Tschechischen Republik"
      ></div>

      <div
        aria-label="Nationalflagge der Bahamas"
        class="flag gradient bahamas"
        role="img"
        title="Nationalflagge der Bahamas"
      ></div>
    </main>

    <footer>
      <nav>
        <ul class="links">
          <li>
            <a href="./data-protection.html" class="text-link-footer"
              >Datenschutzerklärung</a
            >
          </li>
          <div class="icon-links">
            <li>
              <a href="https://github.com/JuliaKleber" class="icon-link">
                <i class="fa-brands fa-github"></i>
              </a>
            </li>
            <li>
              <a
                href="https://www.linkedin.com/in/juliakleber/"
                class="icon-link"
              >
                <i class="fa-brands fa-linkedin"></i>
              </a>
            </li>
          </div>
        </ul>
      </nav>
    </footer>
  </body>
</html>
