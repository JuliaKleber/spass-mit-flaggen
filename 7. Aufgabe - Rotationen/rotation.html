<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rotationen | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="../general-styles.css" />
    <link rel="stylesheet" type="text/css" href="styles-loesung.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>Spaß mit Flaggen</h1>
    </header>

    <main class="flags-container">
      <div
        aria-label="Flagge von Schottland"
        class="flag scotland"
        role="img"
        title="Flagge von Schottland"
      >
        <div class="beam top-left-to-bottom-right"></div>
        <div class="beam bottom-left-to-top-right"></div>
      </div>

      <div
        aria-label="Nationalflagge von Trinidad und Tobago"
        class="flag trinidad-and-tobago"
        role="img"
        title="Nationalflagge von Trinidad und Tobago"
      >
        <div class="white"></div>
        <div class="black"></div>
      </div>
    </main>
  </body>
</html>
