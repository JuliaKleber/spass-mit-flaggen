<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>box-shadow & ::before | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="../general-styles.css" />
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>Spaß mit Flaggen</h1>
    </header>

    <main class="flags-container">
      <div
        aria-label="Nationalflagge von Deutschland"
        class="flag germany"
        role="img"
        title="Nationalflagge von Deutschland"
      ></div>

      <div
        aria-label="Nationalflagge von Irland"
        class="flag ireland"
        role="img"
        title="Nationalflagge von Irland"
      ></div>

      <div
        aria-label="Nationalflagge von Mauritius"
        class="flag mauritius"
        role="img"
        title="Nationalflagge von Mauritius"
      ></div>
    </main>
  </body>
</html>
