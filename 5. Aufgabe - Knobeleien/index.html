<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knobeleien | Spaß mit Flaggen</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Spaß mit Flaggen</h1>
    </header>

    <main class="flags-container">
      <div
        class="flag czech-republic-flag"
        title="Nationalflagge der Tschechischen Republik"
      >
        <div class="blue"></div>
        <div class="stripe white"></div>
        <div class="stripe red"></div>
      </div>

      <div class="flag bahamas-flag" title="Nationalflagge der Bahamas">
        <div class="black"></div>
        <div class="stripe blue"></div>
        <div class="stripe yellow"></div>
        <div class="stripe blue"></div>
      </div>

      <div class="flag scottish-flag" title="Flagge von Schottland">
        <div class="beam top-left-to-bottom-right"></div>
        <div class="beam bottom-left-to-top-right"></div>
      </div>

      <div class="flag british-flag" title="Nationalflagge von Großbrittanien">
        <div class="andreas-cross">
          <div class="white beam white-diagonal top-left-to-bottom-right"></div>
          <div class="white beam white-diagonal bottom-left-to-top-right"></div>
        </div>

        <div class="red-diagonal">
          <div class="red red-diagonal-beam top-left-to-center"></div>
          <div class="red red-diagonal-beam top-right-to-center"></div>
          <div class="red red-diagonal-beam bottom-right-to-center"></div>
          <div class="red red-diagonal-beam bottom-left-to-center"></div>
        </div>

        <div class="white-cross">
          <div class="white beam horizontal"></div>
          <div class="white beam vertical"></div>
        </div>

        <div class="red-cross">
          <div class="red beam vertical red-foreground"></div>
          <div class="red beam horizontal red-foreground"></div>
        </div>
      </div>
    </main>
  </body>
</html>
